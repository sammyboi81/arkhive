[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humane-intelligence"
version = "0.1.1"
description = "Local-first governed memory for AI agents, with persistent identity, tamper-evident history, verification, and constraint-aware decisions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "ZagAIrot Technologies LLC" }]
keywords = ["mcp", "model-context-protocol", "ai-memory", "agent-memory", "claude", "codex", "llm", "ai-agents", "ai-governance", "tamper-evident", "audit-log", "local-first", "responsible-ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp>=1.0.0"]

[project.optional-dependencies]
http = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.0"]

[project.urls]
Homepage = "https://dondatabrain.com"
Repository = "https://github.com/sammyboi81/humane-intelligence"
"Issue Tracker" = "https://github.com/sammyboi81/humane-intelligence/issues"
"License" = "https://github.com/sammyboi81/humane-intelligence/blob/main/LICENSE"
"Live API" = "https://dondatabrain.com/humane-api/docs"

[project.scripts]
arkhive-mcp = "server:main_sync"
humane-intelligence = "server:main_sync"

[tool.setuptools]
py-modules = ["server", "core", "contribution", "http_app"]
