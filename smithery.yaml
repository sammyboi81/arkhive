# Smithery configuration — https://smithery.ai/docs
# ArkHive MCP: local-first stdio server installed from PyPI.
startCommand:
  type: stdio
  configSchema:
    # No configuration is required; the server is local-first with no keys.
    type: object
    properties: {}
  commandFunction: |-
    (config) => ({ command: "arkhive", args: [] })
build:
  dockerfile: Dockerfile
  dockerBuildPath: .
